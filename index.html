<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balap Karung - Sack Race</title>
    <link href="/src/style.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-4xl font-bold text-center mb-8 text-blue-600">Balap Karung - Sack Race</h1>
        
        <!-- Input Controls -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Participant Names Input -->
                <div>
                    <label for="participants" class="block text-sm font-medium text-gray-700 mb-2">
                        Participant Names (one per line, up to 200)
                    </label>
                    <textarea 
                        id="participants" 
                        rows="10" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                        placeholder="Enter participant names, one per line..."></textarea>
                    <div class="mt-2 flex gap-2">
                        <button 
                            id="generateNames" 
                            class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600 transition">
                            Generate 200 Names
                        </button>
                        <span id="participantCount" class="px-4 py-2 text-gray-600">0 participants</span>
                    </div>
                </div>
                
                <!-- Race Settings -->
                <div>
                    <label for="duration" class="block text-sm font-medium text-gray-700 mb-2">
                        Race Duration
                    </label>
                    <select 
                        id="duration" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="fast">Fast (15 seconds)</option>
                        <option value="medium" selected>Medium (30 seconds)</option>
                        <option value="slow">Slow (60 seconds)</option>
                    </select>
                    
                    <div class="mt-4 flex items-center gap-2">
                        <button 
                            id="toggleSound" 
                            class="px-4 py-2 bg-purple-500 text-white rounded-lg hover:bg-purple-600 transition">
                            🔊 Sound ON
                        </button>
                        <span class="text-sm text-gray-600">Click to toggle sound effects</span>
                    </div>
                    
                    <button 
                        id="startRace" 
                        class="mt-6 w-full px-6 py-3 bg-blue-600 text-white text-lg font-semibold rounded-lg hover:bg-blue-700 transition shadow-lg disabled:bg-gray-400 disabled:cursor-not-allowed">
                        🏁 Start Race!
                    </button>
                    
                    <button 
                        id="resetRace" 
                        class="mt-3 w-full px-6 py-3 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition">
                        🔄 Reset Race
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Race Canvas -->
        <div class="bg-white rounded-lg shadow-lg p-4">
            <div id="raceContainer" class="w-full overflow-hidden"></div>
        </div>
    </div>
    
    <!-- Winner Modal -->
    <div id="winnerModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-2xl p-8 max-w-md w-full mx-4 transform transition-all">
            <h2 class="text-3xl font-bold text-center mb-4 text-yellow-500">🏆 Winner! 🏆</h2>
            <p id="winnerName" class="text-2xl text-center mb-6 font-semibold text-gray-800"></p>
            <button 
                id="closeModal" 
                class="w-full px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
                Close
            </button>
        </div>
    </div>
    
    <script type="module" src="/src/main.js"></script>
</body>
</html>
